[project]
name = "cs03-pyser"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "avro>=1.12.1",
    "cloudpickle>=3.1.2",
    "grpcio-tools>=1.78.0",
    "numpy>=2.4.2",
    "orjson>=3.11.7",
    "protobuf>=6.33.5",
    "pydantic>=2.12.5",
    "pyfory>=0.14.1",
]

[project.scripts]
harness = "harness:main"

[tool.setuptools]
py-modules = ["harness", "generate", "schema", "schema_pb2", "sd_avro", "sd_cloudpickle", "sd_fory", "sd_orjson", "sd_pickle", "sd_protobuf", "sd_pydantic", "sd_struct"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.0",
    "ty>=0.0.15",
]
