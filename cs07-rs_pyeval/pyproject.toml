[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "rs_pyeval"
version = "0.1.0"
description = "A rust library with python bindings for evaluating expressions."
requires-python = ">=3.8"
dependencies = []

[dependency-groups]
dev = [
    "maturin>=1.13.1",
    "pytest>=7.0",
    "ruff>=0.1.0",
    "ty==0.0.15",
]

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "rs_pyeval._rs_pyeval"
