[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "cashme"
requires-python = ">=3.10,<3.14" # 3.14 bound due to pyO3 currently max supported version
version = "0.1.0"
dependencies = []

[project.scripts]
cashme = "cashme:main"

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "cashme._cashme"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.2",
    "ty==0.0.15",
    "maturin>=1.12.4",
]
