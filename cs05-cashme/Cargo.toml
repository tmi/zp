[package]
name = "cashme"
version = "0.1.0"
edition = "2021"

[lib]
name = "cashme"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "cashme-cli"
path = "src/main.rs"

[dependencies]
# TODO we disable extension-module to get it built, but that links the cli app to python which we dont want -- we need to separate the lib in two
# pyo3 = { version = "0.23", features = ["extension-module"] }
pyo3 = { version = "0.23" }
clap = { version = "4.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
