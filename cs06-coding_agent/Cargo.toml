[package]
name = "coding_agent"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.11", features = ["json"] }
ratatui = "0.26"
crossterm = { version = "0.27", features = ["events"] }
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
async-trait = "0.1"

[dev-dependencies]
tempfile = "3"
