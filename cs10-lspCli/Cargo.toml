[package]
name = "cs10-lspCli"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lsp-types = "0.95"
tokio = { version = "1.37", features = ["full"] }
nix = { version = "0.29", features = ["fs", "process", "signal"] }
anyhow = "1.0"
libc = "0.2"
fs2 = "0.4" # for locking if needed
url = "2.5"
